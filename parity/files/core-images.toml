[[file]]
upstream = "src/core/images/image_attachments.zig"
status = "partial"
modules = ["crates/ofx-images/src/image_attachments.rs", "crates/oh-fx/src/ask_images.rs"]
note = "Loading a typed image path exists (path normalization, workspace or external resolution, the size limit, and the header sniff that `ask --image` checks), as do snapshot capture into a private no-follow directory with rollback, verified snapshot loading for file and inline bytes, and temporary snapshot directories, removed when their owner drops without following a symlink at any level, as cleanupSnapshotDir's no-follow parent and deleteTree do. Each request leaves out attachments over the pixel or encoded byte limit, or whose dimensions cannot be read, with upstream's notice, using a dimension cache keyed by snapshot digest that each transport keeps for its lifetime instead of each turn and that holds only successful reads, so an unreadable snapshot is read again and never withholds another snapshot of the same bytes, where upstream's per-turn cache also keeps a failed read. Capture admission notices, bound and inline capture, snapshot cloning and unreferenced cleanup, the Vercel file part, placeholders and badges, inline path promotion, the clipboard image, and the trace lines are absent."

