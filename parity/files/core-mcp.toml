[[file]]
upstream = "src/core/mcp/feature_catalog_runtime.zig"
status = "partial"
modules = ["crates/ofx-mcp/src/feature_catalog_runtime.rs"]
note = "Resource, template and prompt catalogs are fetched page by page and refreshed by freshness and list_changed invalidation. A stopped stdio server is restarted under the refresh lock first. A new connection starts with empty catalogs, while a failed server keeps its last catalogs and capabilities and serves them after a failed refresh. A catalog fetched from a connection that was replaced meanwhile is not published; the latest published catalog is served instead, or McpResourceCatalogUnavailable or McpPromptCatalogUnavailable when there is none. Auth identity checks during paging are missing."

[[file]]
upstream = "src/core/mcp/feature_operations.zig"
status = "partial"
modules = ["crates/ofx-mcp/src/feature_operations.rs"]
note = "Resource, template and prompt listing, resource reads and prompt gets exist. Reads have the 64-entry read cache, the stale fallback for transient transport failures and a restart past its limit, and the checks before a read is sent and before it is cached. A read cached under a private cacheScope is shared like a public one until OAuth lands, as docs/differences/mcp.md records. A prompt get resolves the prompt and checks its arguments, restarts a stopped stdio server, refuses a changed prompt catalog before it is sent, and returns a JSON-RPC error as its protocol diagnostic. A completion resolves its prompt or exact resource template, restarts a stopped stdio server, checks its request and refuses a changed catalog before it is sent. Modern resource update subscriptions, URL elicitation and input-required rounds are missing."

[[file]]
upstream = "src/core/mcp/feature_result.zig"
status = "ported"
modules = ["crates/ofx-mcp/src/feature_result.rs", "crates/ofx-mcp/src/feature_operations.rs"]
note = "The untrusted-data envelopes for every mcp_features action and the unsupported envelope are written in feature_result.rs, and the resource and prompt summaries live in feature_operations.rs. Binary resource contents and prompt images are described as unsent instead of attached, as docs/differences/mcp.md records."

[[file]]
upstream = "src/core/mcp/feature_snapshot.zig"
status = "partial"
modules = ["crates/ofx-mcp/src/feature_snapshot.rs"]
note = "Concrete and template resource identities under one shared match budget exist, with the currency check before a read is sent and before it is cached, both against the connection that will send or sent the read. Prompt identities resolve the prompt by name and check the prompts/get arguments, as snapshotPromptIdentity does, with the same currency check before the get is sent. Currency compares the listed resources, templates or prompts as oh-fx keeps them instead of upstream's digest of every descriptor field, so a refresh that changes only fields oh-fx does not keep, such as a resource's icons, annotations, size or _meta, or a prompt's icons or _meta, keeps a resolved identity current, as docs/differences/mcp.md records. The check before sending runs just before the request, where upstream's guard spans the send for HTTP servers, as docs/differences/mcp.md records. Exact resource template identities for completion exist, as snapshotResourceTemplateIdentity resolves them."

