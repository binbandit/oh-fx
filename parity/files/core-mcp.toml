[[file]]
upstream = "src/core/mcp/catalog_refresh.zig"
status = "partial"
modules = ["crates/ofx-mcp/src/catalog_refresh.rs"]
note = "A tool list is listed again when it expired or a tools/list_changed notification made it stale, before a call, right after the notification or after the listing then in flight, and on reload, as docs/differences/mcp.md records. A refresh in flight shows refreshing, a call waits for one that fetches a pending change and otherwise goes ahead with the last list as upstream's does, a call is refused with McpToolCatalogChanged while a change stays unfetched, a call whose deadline passes before tools/call is sent fails with McpRequestTimedOut as upstream's operation check does, a failed or abandoned refresh keeps the tools with failed_refresh and its retry backoff, and an unchanged list keeps its snapshot. Auth partitions, legacy session and credential recovery, and listener restarts are missing."

