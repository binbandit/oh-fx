[[file]]
upstream = "src/core/terminal/action_executor.zig"
status = "not-applicable"
modules = []
note = "The executor validates a request, queues it on the terminal client and polls for its completion. oh-fx's terminal actions are async calls on Terminals with no queue or worker, so a request is checked by the registry as upstream's validation does, an owner that is exiting refuses a start with cancelled as mapAdmissionError does, and the queue-full and disconnect failures cannot occur, as docs/differences/tool-shell.md records."

[[file]]
upstream = "src/core/terminal/client.zig"
status = "partial"
modules = ["crates/ofx-exec/src/native_session/registry.rs", "crates/ofx-exec/src/native_session/descriptor_budget.rs"]
note = "Terminals is the terminal client: it opens nothing until a terminal starts, the first start raises the soft descriptor limit to 1024 within the hard limit with upstream's terminal_client lines, and close_owned_terminals ends every terminal of the process and refuses later starts. The request queue, worker thread, correlation ids, completion polling and the terminal UI projection are not ported, because oh-fx's terminal actions are async calls that nothing queues, as docs/differences/tool-shell.md records."

[[file]]
upstream = "src/core/terminal/contracts.zig"
status = "partial"
modules = ["crates/ofx-exec/src/terminal_contracts.rs"]
note = "Terminal dimensions, the command, authority text and shell path limits that bound the launcher's configuration, the lifecycle with its transitions, the shell spec, the started and exit return conditions, return outcomes, the close policy, session facts (id, lifecycle, timed out) and structured failures for start, read, screen, write, wait, inspect, list, signal and close, with the five terminal signals and process_identity_unavailable, are ported (OH-19). Match and quiet conditions, resize, attention, cursors, ranges and screen recovery facts are not ported, because no caller uses them at the pin."

[[file]]
upstream = "src/core/terminal/engine.zig"
status = "partial"
modules = ["crates/ofx-vt/src/engine.rs"]
note = "The grid's text model is ported for replay: parsing, cursor movement, wrapping, erasing, insertion and deletion, scroll regions, the alternate screen, synchronized output, resizing, and snapshots. The screen text a terminal's screen action returns is ported as `Grid::screen_text`, with the rules of the observer's renderScreenText. Live feeds answer upstream's protocol queries (device status and cursor position reports, primary and secondary device attributes, the 14t, 16t, 18t and 19t window reports, and DECRQSS for m and r) within upstream's reply bounds, while replays answer nothing. A cursor position report in origin mode whose cursor sits above the scroll region answers the region's first row, where upstream's subtraction overflows, as docs/differences/tool-shell.md records. Cell styles, hyperlinks, checkpoints, and diffs are not."

[[file]]
upstream = "src/core/terminal/identity.zig"
status = "not-applicable"
modules = []
note = "profileUser names the local profile only inside terminal authority principals; since #1137 the agent in the owning process is the only actor on its terminals, so oh-fx keeps no authority principals and checks a terminal's owner session instead, as docs/differences/tool-shell.md records."

[[file]]
upstream = "src/core/terminal/managed_observer.zig"
status = "partial"
modules = ["crates/ofx-vt/src/engine.rs", "crates/ofx-exec/src/terminal_observer.rs"]
note = "renderScreenText is ported as ofx-vt's Grid::screen_text with upstream's test. observe, refresh, syncOwned, snapshotState, resolveCompletedStatus, reconcileObservedState, mapTerminalFailure and isDefinitiveLoss are ported with upstream's test. An observation drains the terminal's unread output instead of reading the journal from the execution's cursor, so it has no cursor and the output and its byte count come from that drain, as docs/differences/tool-shell.md records, and a caller that fails after observing keeps the drained output with its execution (TerminalObserver::keep) for the next result, where upstream leaves the execution's cursor where it was; output containing an escape is returned as the rendered screen, as upstream's is. inspectInput, which only the auto-mode review of shell input uses, arrives with it (OH-19)."

[[file]]
upstream = "src/core/terminal/native_session.zig"
status = "partial"
modules = ["crates/ofx-exec/src/native_session.rs", "crates/ofx-exec/src/native_session/control.rs", "crates/ofx-exec/src/native_session/launch.rs", "crates/ofx-exec/src/native_session/launcher.rs", "crates/ofx-exec/src/native_session/marker.rs", "crates/ofx-exec/src/native_session/output.rs", "crates/ofx-exec/src/native_session/processes.rs", "crates/ofx-exec/src/native_session/registry.rs", "crates/ofx-exec/src/native_session/session.rs"]
note = "The launcher and control-marker process modes (--oh-fx-internal-terminal-launcher and --oh-fx-internal-terminal-control) and the launch that starts a command's shell on a PTY through them are ported with upstream's frames, markers, bootstrap, echo restore and watchdog; the private files are /tmp/oh-fx-terminal-<hex>.* and the bootstrap's variables oh_fx_terminal_command and oh_fx_terminal_status. A launcher whose shell ends while it waits for the command's release stops waiting at once, and the echo restore blocks SIGTTOU so it takes effect where upstream's fails with EIO, as docs/differences/tool-shell.md records. The session and its registry are ported for start, read, screen, write, wait, inspect, list, close and the exit close: up to 64 terminals with recycling of ended ones, the output and control threads, the control frame handling, the started and exit waits with their ceiling and cancellation, writes that end with the close, the graceful close's terminate, 800 ms grace and kill, the forced close, the timeout watcher that marks a terminal timed out and kills its group, the hangup, grace and kill when the owner exits, and the answers a terminal saved by another process gives from its record. Unread output is kept in memory rather than journaled, so a saved terminal reads as empty and incomplete and has no screen, as docs/differences/tool-shell.md records. A start refused for capacity or because the owner is exiting removes its record, where upstream leaves a starting record behind, and a start whose terminal the exit close ended before its launcher was released does not release it, where upstream starts its shell and ends it at shell-ready. Commandless terminals, which no caller starts at the pin, are not ported. The grid's protocol replies are written back to the terminal unless a close has begun, and one that does not fit at once is dropped as upstream's is; a reply can land between two chunks of a large write, where upstream's write lock keeps replies between whole writes, and a reply due while a write waits for room on a full PTY is dropped, where upstream's output thread waits for that write to finish and then writes it, as docs/differences/tool-shell.md records. Requests are checked as upstream's validation does before anything runs, and once a close begins every later action on the terminal, live or saved, answers authority_denied as upstream's revoked authority does. A close revokes input without waiting for a write in progress, and a write blocked on a full PTY ends with authority_denied once a close begins, where upstream's close waits for the write, as docs/differences/tool-shell.md records. Match and quiet waits, resize and monitors are not ported, because no caller uses them at the pin. The signal action, the forced close and the exit close follow upstream's signalTerminalProcesses, signalVerifiedProcessGroup, hangUpForExit and killForExit: on Linux the shell's process identity (boot id and start time) is captured when the command starts and checked before every signal, and the shell's process tree is walked so processes that left its group are signalled too; a forced close whose tree could not be signalled completely answers session_lost after closing. Once the shell has exited, oh-fx still signals its process group while that group holds the terminal open and one of its members is in the session the shell started in, and a close stops reading output that has not ended 800 ms after the terminal settled, where upstream refuses to signal the group and its close waits for the output to end, as docs/differences/tool-shell.md records. A signal does not wait for a write in progress, where upstream's waits on the write lock. On macOS a terminal's signals reach the shell's process group only and its identity is not checked, as docs/differences/tool-shell.md records (OH-19)."

[[file]]
upstream = "src/core/terminal/operation.zig"
status = "partial"
modules = ["crates/ofx-exec/src/native_session/registry.rs"]
note = "validate is ported as the registry's request checks. The authority claims that every terminal action carries, and the process owner attached to them, are not: since #1137 only the agent in the owning process acts on its terminals, so oh-fx checks a terminal's owner session instead, as docs/differences/tool-shell.md records. The ordered mutations that share a terminal's write ownership become one session's write lock, which serializes its writes."

[[file]]
upstream = "src/core/terminal/recovery.zig"
status = "partial"
modules = ["crates/ofx-exec/src/terminal_recovery.rs"]
note = "The record decision is ported: final lifecycles stay, a saved termination finalizes as exited, and any other live terminal of another process is lost. Records of this process are left untouched, records that do not decode are skipped rather than isolated, and the unavailable disposition (no process evidence) does not exist because oh-fx checks no process liveness. Checkpoint and screen evidence are not ported, because oh-fx saves no terminal journals or checkpoints (OH-19)."

[[file]]
upstream = "src/core/terminal/shell_resolver.zig"
status = "partial"
modules = ["crates/ofx-exec/src/shell_resolver.rs"]
note = "Captured invocation, login-shell fallback and clean/user environment selection exist, and a terminal's executable shell resolves to upstream's interactive argv with its bootstrap and source commands; a terminal's shell spec resolves the user's login shell or pins an explicit one as upstream's resolve does; profileShell is ported for the shell tool's terminal runs, and environmentForShellSpec's checks run as check_terminal_shell before a terminal starts; the environment it builds only feeds upstream's admission fingerprint, which oh-fx's prepared call replaces. #1137's snapshot invocation, capture scripts and replay arrive with the startup snapshot."

[[file]]
upstream = "src/core/terminal/shell_snapshot.zig"
status = "todo"
modules = []
note = "#1137: user-profile commands capture the login shell's startup state once per process and restore it for later commands, refreshing when a watched startup file changes; not yet ported."

[[file]]
upstream = "src/core/terminal/store.zig"
status = "partial"
modules = ["crates/ofx-exec/src/terminal_store.rs"]
note = "Terminal records are ported: private per-owner folders with record-<id>.json in upstream's field names for the fields kept, lifecycle, start, deadline, termination, loss and close updates, rollback of an unreleased start, owner identities, lookup of a terminal across owners, and owner reconciliation. Journals, checkpoints, events, authority and proof files, close transactions, quota eviction, resident tracking, process liveness checks, and the backend, backend_identity and process_token fields are not, because terminals end with the process that started them and only this process acts on them; docs/differences/tool-shell.md records it (OH-19). A save that fails after its rename keeps the record it wrote, as the file now holds it, where upstream restores the previous record in memory and refuses later saves until the folder syncs, after which a later save can overwrite the saved outcome."

