[[file]]
upstream = "src/core/terminal/contracts.zig"
status = "partial"
modules = ["crates/ofx-exec/src/terminal_contracts.rs"]
note = "Terminal dimensions, the command, authority text and shell path limits that bound the launcher's configuration, the lifecycle with its transitions, the shell spec, the started and exit return conditions, return outcomes, the close policy, session facts (id, lifecycle, timed out) and structured failures for start, read, screen, write, wait, inspect, list and close are ported; the signal action arrives with process signals (OH-19). Match and quiet conditions, resize, attention, cursors, ranges and screen recovery facts are not ported, because no caller uses them at the pin."

[[file]]
upstream = "src/core/terminal/engine.zig"
status = "partial"
modules = ["crates/ofx-vt/src/engine.rs"]
note = "The grid's text model is ported for replay: parsing, cursor movement, wrapping, erasing, insertion and deletion, scroll regions, the alternate screen, synchronized output, resizing, and snapshots. The screen text a terminal's screen action returns is ported as `Grid::screen_text`, with the rules of the observer's renderScreenText. Cell styles, hyperlinks, terminal replies, checkpoints, and diffs are not."

[[file]]
upstream = "src/core/terminal/identity.zig"
status = "not-applicable"
modules = []
note = "profileUser names the local profile only inside terminal authority principals; since #1137 the agent in the owning process is the only actor on its terminals, so oh-fx keeps no authority principals and checks a terminal's owner session instead, as docs/differences/tool-shell.md records."

[[file]]
upstream = "src/core/terminal/managed_observer.zig"
status = "partial"
modules = ["crates/ofx-vt/src/engine.rs"]
note = "renderScreenText is ported as ofx-vt's Grid::screen_text with upstream's test. The observer that refreshes managed terminal executions arrives with the shell tool's terminals (OH-19)."

[[file]]
upstream = "src/core/terminal/native_session.zig"
status = "partial"
modules = ["crates/ofx-exec/src/native_session.rs", "crates/ofx-exec/src/native_session/control.rs", "crates/ofx-exec/src/native_session/launch.rs", "crates/ofx-exec/src/native_session/launcher.rs", "crates/ofx-exec/src/native_session/marker.rs", "crates/ofx-exec/src/native_session/output.rs", "crates/ofx-exec/src/native_session/registry.rs", "crates/ofx-exec/src/native_session/session.rs"]
note = "The launcher and control-marker process modes (--oh-fx-internal-terminal-launcher and --oh-fx-internal-terminal-control) and the launch that starts a command's shell on a PTY through them are ported with upstream's frames, markers, bootstrap, echo restore and watchdog; the private files are /tmp/oh-fx-terminal-<hex>.* and the bootstrap's variables oh_fx_terminal_command and oh_fx_terminal_status. A launcher whose shell ends while it waits for the command's release stops waiting at once, and the echo restore blocks SIGTTOU so it takes effect where upstream's fails with EIO, as docs/differences/tool-shell.md records. The session and its registry are ported for start, read, screen, write, wait, inspect, list, close and the exit close: up to 64 terminals with recycling of ended ones, the output and control threads, the control frame handling, the started and exit waits with their ceiling and cancellation, writes that end with the close, the graceful close's terminate, 800 ms grace and kill, the forced close, the timeout watcher that marks a terminal timed out and kills its group, the hangup, grace and kill when the owner exits, and the answers a terminal saved by another process gives from its record. Unread output is kept in memory rather than journaled, so a saved terminal reads as empty and incomplete and has no screen, as docs/differences/tool-shell.md records. A start refused for capacity or because the owner is exiting removes its record, where upstream leaves a starting record behind, and a start whose terminal the exit close ended before its launcher was released does not release it, where upstream starts its shell and ends it at shell-ready. Commandless terminals, which no caller starts at the pin, are not ported. Requests are checked as upstream's validation does before anything runs, and once a close begins every later action on the terminal, live or saved, answers authority_denied as upstream's revoked authority does. Match and quiet waits, resize and monitors are not ported, because no caller uses them at the pin. The signal action, which the shell tool's stop uses, arrives next; until then the forced close and the exit close signal the shell's process group only, and reaching processes that left it and checking the shell's process identity first arrive with it (OH-19)."

