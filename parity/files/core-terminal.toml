[[file]]
upstream = "src/core/terminal/native_session.zig"
status = "partial"
modules = ["crates/ofx-exec/src/native_session.rs", "crates/ofx-exec/src/native_session/control.rs", "crates/ofx-exec/src/native_session/launch.rs", "crates/ofx-exec/src/native_session/launcher.rs", "crates/ofx-exec/src/native_session/marker.rs"]
note = "The launcher and control-marker process modes (--oh-fx-internal-terminal-launcher and --oh-fx-internal-terminal-control) and the launch that starts a command's shell on a PTY through them are ported with upstream's frames, markers, bootstrap, echo restore and watchdog; the private files are /tmp/oh-fx-terminal-<hex>.* and the bootstrap's variables oh_fx_terminal_command and oh_fx_terminal_status. A launcher whose shell ends while it waits for the command's release stops waiting at once, and the echo restore blocks SIGTTOU so it takes effect where upstream's fails with EIO, as docs/differences/tool-shell.md records. Commandless terminals, which no caller starts at the pin, are not ported. The session registry, output, waits, writes, signals and closes arrive next (OH-19)."

