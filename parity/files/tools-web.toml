[[file]]
upstream = "src/tools/web/content.zig"
status = "ported"
modules = ["crates/ofx-tools/src/web/content.rs"]
note = "MIME and sniff classification, conversion dispatch and content caps match upstream; its Classification.declared flag is read only by its tests and is not kept."

[[file]]
upstream = "src/tools/web/fetch.zig"
status = "partial"
modules = ["crates/ofx-tools/src/web/fetch.rs"]
note = "URL fetch, converted-text cache/progress and result envelopes exist; binary artifact storage/reference publication, quota settlement and stale artifact refetch are absent. These are pending port gaps."

[[file]]
upstream = "src/tools/web/fetch_args.zig"
status = "ported"
modules = ["crates/ofx-tools/src/web/fetch_args.rs"]
note = "URL-required object validation, nonempty URL handling and ordered argument errors match the source argument tests; URL safety policy is handled separately."

[[file]]
upstream = "src/tools/web/html_to_markdown.zig"
status = "ported"
modules = ["crates/ofx-tools/src/web/html_to_markdown.rs"]
note = "HTML tag/entity handling, links/images, lists/tables/code and bounded Markdown conversion are implemented with conversion regressions; documented unsafe-text handling applies."

[[file]]
upstream = "src/tools/web/http_fetch.zig"
status = "ported"
modules = ["crates/ofx-tools/src/web/http_fetch.rs"]
note = "Bounded HTTP fetch, status/encoding settlement and redirect policy are implemented with transport regressions; TLS/public-address/redirection safety differences are documented in architecture.md."

[[file]]
upstream = "src/tools/web/search.zig"
status = "partial"
modules = ["crates/ofx-tools/src/web/search.rs"]
note = "The provider-run tool's schema, description and argument checks exist, and a local call reports upstream's unavailable message; the function-tool backend call and the bounded Markdown result formatting are missing."

[[file]]
upstream = "src/tools/web/search_args.zig"
status = "ported"
modules = ["crates/ofx-tools/src/web/search_args.rs"]
note = "Argument decoding, empty-filter normalization and the one-filter rule match upstream's tests; the read-only classification has no local consumer because web_search runs only as a provider tool."

[[file]]
upstream = "src/tools/web/url_policy.zig"
status = "ported"
modules = ["crates/ofx-tools/src/web/url_policy.rs"]
note = "URL parsing, target validation and ordered error reasons are implemented; documented public-address/TLS/credential-redaction safety differences apply."
