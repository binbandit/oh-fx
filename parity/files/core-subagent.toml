[[file]]
upstream = "src/core/subagent/agent_adapter.zig"
status = "partial"
modules = ["crates/ofx-agent/src/subagent/execution.rs", "crates/ofx-app/src/app_subagent_runtime.rs"]
note = "Child turns run through Agent with inherited root-user review context, forwarded approval requests, restart notices in their live text, and the parent's MCP tools from the live catalog, each child logs its turns into its own saved session with the work id, child turns dispatch PostTurnEnd hooks with the subagent scope, and each child run takes its own trace turn and subagent ids and writes its trace_identity line; the child turn routed and child_execution_failed trace lines, provider credential/capability routing, captured MCP authority views, child steering, and recovery checkpoints are absent; a resumed named child continues from its saved history and settings, and a replayed operation reads its reply from the child's history."

[[file]]
upstream = "src/core/subagent/approval_registry.zig"
status = "partial"
modules = ["crates/ofx-app/src/approval_queue.rs"]
note = "A child's approval request is shown on the parent's prompt during the parent's turn, after the request already shown, and is denied when no turn is running or the turn ends; stable approval ids and fingerprints, worker route pinning and the 64-request cap are absent."

