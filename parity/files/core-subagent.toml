[[file]]
upstream = "src/core/subagent/agent_adapter.zig"
status = "partial"
modules = ["crates/ofx-agent/src/subagent/execution.rs"]
note = "Child turns run through Agent with inherited root-user review context and forwarded approval requests, and each child logs its turns into its own saved session with the work id; provider credential/capability routing, MCP authority views, child steering, recovery checkpoints and replayed results read from the child's history are absent."

[[file]]
upstream = "src/core/subagent/approval_registry.zig"
status = "partial"
modules = ["crates/ofx-app/src/approval_queue.rs"]
note = "A child's approval request is shown on the parent's prompt during the parent's turn, after the request already shown, and is denied when no turn is running or the turn ends; stable approval ids and fingerprints, worker route pinning and the 64-request cap are absent."

[[file]]
upstream = "src/core/subagent/authority.zig"
status = "todo"
modules = []

[[file]]
upstream = "src/core/subagent/child_state.zig"
status = "partial"
modules = ["crates/ofx-agent/src/subagent/child_state.rs", "crates/ofx-agent/src/subagent/child_state/registry_file.rs", "crates/ofx-session/src/session_children.rs"]
note = "The registry tracks bounded children, work fingerprints, phases, outcomes and generations and is written to the parent's children.json as upstream writes it, with each child session's owner marker; reading the registry back on resume, interruptActive, v2 child-line folding and the Lost outcome are absent."

[[file]]
upstream = "src/core/subagent/domain.zig"
status = "partial"
modules = ["crates/ofx-contract/src/subagent/domain.rs"]
note = "Name/instruction/text validators exist; admission authority snapshots, identity membership and capability ownership are missing."

[[file]]
upstream = "src/core/subagent/execution.zig"
status = "partial"
modules = ["crates/ofx-agent/src/subagent/execution.rs"]
note = "Child turns preserve final or partial text, cancellation and bounded failure diagnostics, and commit to the child's own session; recovery admission and compaction work-identity persistence are absent."

[[file]]
upstream = "src/core/subagent/live_metrics.zig"
status = "todo"
modules = []
note = "A child's input tokens are not tracked while it works, so its status line shows the model and effort without them."

[[file]]
upstream = "src/core/subagent/managed_owner.zig"
status = "partial"
modules = ["crates/ofx-agent/src/subagent/managed_owner.rs"]
note = "Native owner starts and observes children, retains results, forwards approval requests, cancels abandoned waits and publishes the registry to the parent session after every change; feedback queues, approval route pinning and live metrics are absent."

[[file]]
upstream = "src/core/subagent/model_contract.zig"
status = "partial"
modules = ["crates/ofx-contract/src/subagent/model_contract.rs"]
note = "Request/result validation exists; matchCatalogModel catalog matching and ambiguity resolution are missing."

[[file]]
upstream = "src/core/subagent/resume_admission.zig"
status = "partial"
modules = ["crates/ofx-session/src/session_store.rs", "crates/ofx-session/src/session_discovery.rs"]
note = "Child sessions are left out of listings and latest-session selection, and a direct resume of one is refused with OneOffSessionNotResumable; the session index cache and read-only detail admission are absent."

[[file]]
upstream = "src/core/subagent/tool_host.zig"
status = "partial"
modules = ["crates/ofx-agent/src/subagent/tool_host.rs", "crates/ofx-agent/src/subagent/managed_owner.rs"]
note = "Managed request admission, invocation identity, inherited defaults and terminal result projection exist; catalog override resolution, host authority snapshots and child feedback are absent, and the child's status is published once with its model and effort, without upstream's throttled input-token refresh."

[[file]]
upstream = "src/core/subagent/tool_provider.zig"
status = "partial"
modules = ["crates/ofx-contract/src/subagent/tool_provider.rs", "crates/ofx-agent/src/subagent/tool_host.rs", "crates/ofx-app/src/app_subagent_runtime.rs"]
note = "Provider forwarding has a concrete managed host with cancellation-to-child_cancelled mapping; `ask` and the interactive session install it when they save their session."
