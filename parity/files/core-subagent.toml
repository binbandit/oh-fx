note = "The registry tracks bounded children, work fingerprints, phases, outcomes and generations and is written to and read back from the parent's children.json as upstream does, with the awaiting_approval phase while a child's approval is pending, interruptActive on resume and each child session's owner marker; v2 child-line folding and the Lost outcome are absent."

