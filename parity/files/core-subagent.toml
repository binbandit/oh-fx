[[file]]
upstream = "src/core/subagent/tool_host.zig"
status = "partial"
modules = ["crates/ofx-agent/src/subagent/tool_host.rs", "crates/ofx-agent/src/subagent/managed_owner.rs"]
note = "Managed request admission with its admission requested and rejected trace lines, invocation identity, inherited defaults and terminal result projection exist; the child session and parent cancel trace lines, catalog override resolution, host authority snapshots and child feedback are absent, and the child's status is published once with its model and effort, without upstream's throttled input-token refresh."

[[file]]
