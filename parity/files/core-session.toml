note = "A session's usage snapshot exists with upstream's validation, its schema-3 writer and its schema-2 and schema-3 reader, including fx's pending Gateway generations; the legacy 18-field reader turns fx's separate-cache accounting into legacy usage for schema-v3 conversions. Live accounting, which a subagent's log shares with its parent session, reserves each request durably before it is sent, settles it with its delivery outcome, and keeps API time, wall time from the session start, committed lines and incidents, saving usage-v2.json at each step as the usage_checkpointed event does. Exact settlement hashes the provider's response id into upstream's canonical generation id, records the pending generation with its exact origin and stages its record in the publication backlog, leaving billing pending, with upstream's identity, capacity and record checks. Each settlement schedules a background drain as scheduleProfilePublicationDrain does: pending markers, incidents and backlog records reach the profile ledger, stopping at a busy or abandoned lock, and each published record applies to the totals and model aggregates as applyGenerationUnlocked does; a session drains synchronously before it closes. The dirty-state settle at close, the rollback-readable writer and the projection comparisons are absent, and deferred Gateway reconciliation waits for the Vercel AI Gateway transport."

