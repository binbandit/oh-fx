status = "partial"
modules = ["crates/ofx-session/src/profile_usage_runtime.rs"]
note = "Rolling reports are built from the durable ledger, with unresolved pending markers as pending incidents and a marker newer than the report as an incomplete one; the publisher sink appends each event under one mutex and reports a conflicting duplicate as ConflictingUsagePublication, and process exit abandons the ledger lock without the mutex; the recovered session usage input and the three-scope set the dashboard loads arrive with usage recovery and the dashboard."

[[file]]
upstream = "src/core/session/profile_usage_store.zig"
status = "partial"
modules = ["crates/ofx-session/src/profile_usage_store.rs", "crates/ofx-session/src/profile_usage_store/append.rs", "crates/ofx-session/src/profile_usage_store/compaction.rs", "crates/ofx-session/src/profile_usage_store/records.rs"]
note = "Read-only loading exists: it creates nothing, waits up to 2 s for an existing usage.lock, retries when a lock appears during an unlocked read, keeps the first record of an id and one conflicting variant, and enforces the mode, link, record and size limits. appendEvent exists with its record writers: the coverage record on the first write, an exact replay as a duplicate and one conflicting variant per id, tail repair with an incident, the 4096-incident cap, the resident index with its 32-byte tail sample and incremental absorb of other writers' appends, and the abandon flag checked during the lock wait and every 256 parsed lines. Compaction keeps the coverage record and every fact, unresolved pending marker and incident from the last 35 days: before an append that would pass the byte or record limit when expired or resolved records exist, together with tail repair when the tail is torn, and after an append past 8 MiB when records have aged a day past the window or the appended record is older than it, unless the ledger was abandoned. The ledger lives in the oh-fx data directory, as docs/differences/usage.md records."

