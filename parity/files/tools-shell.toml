[[file]]
upstream = "src/tools/shell/shell.zig"
status = "partial"
modules = ["crates/ofx-tools/src/shell.rs", "crates/ofx-tools/src/shell/request.rs", "crates/ofx-tools/src/shell/snapshot_format.rs", "crates/ofx-tools/src/shell/terminal.rs"]
note = "Run/interact/stop/list request validation and captured snapshots exist. The terminal mode is ported: callTtyRun, callTtyInteract and callTtyStop with ttyShell, cloneTerminalFailure, finalizeCompletedTty, closeTtyBestEffort, finishPreparedWithAccepted, ensureOwnedTtyIndexed, terminalEndedWithOwner, refreshTtyExecution and finishTerminalTtyStop, the full schema, and request_correction's supports_tty; the app does not bind the tool to a session's terminals yet (OH-19). requireTtyShellAuthority's fingerprint is replaced by the shell spec, working directory and held directory the prepared call resolved, where a user-login shell is read again when the terminal starts, input is one write instead of a write lease's acquire, use and release, and the TerminalEnded message names oh-fx, as docs/differences/tool-shell.md records. Direct read-only routes and persisted command replay are absent. #1137's reload field is accepted on run and keeps remembered approvals from covering the call; its startup snapshot is not yet ported."
