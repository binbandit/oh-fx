[[file]]
upstream = "src/tools/shell/process_provider.zig"
status = "partial"
modules = ["crates/ofx-exec/src/managed_execution.rs", "crates/ofx-exec/src/native_session/processes.rs", "crates/ofx-exec/src/process_tree.rs"]
