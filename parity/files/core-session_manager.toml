[[file]]
upstream = "src/core/session_manager/api.zig"
status = "partial"
modules = ["crates/ofx-session/src/session_manager.rs"]
note = "Manager.list, peek, read (forward, by id, without the lock), getBlob and verify exist, reading a root that exists without creating one, as readyToRead does, with their id checks and error mapping; the workspace filter, which no fx host passes, is left out. The other operations and input checks come with the slices that use them, and rebuild and openImport stay out because fx never calls them."

[[file]]
upstream = "src/core/session_manager/catalog.zig"
status = "partial"
modules = ["crates/ofx-session/src/session_manager/catalog.rs"]
note = "Index records decode and fold as upstream: the newest put per id with merged open times, a final tombstone, damaged lines skipped and a torn last line ignored, and list sorts newest updated first with ties to the smaller id and pages with upstream's cursor. Listing is read-only for now: a folder that is gone is skipped without the tombstone upstream writes, and a damaged index is folded without the rewrite; the index lock, appends, compaction and heal come with the v2 writer, and rebuild stays out because fx never calls it."

[[file]]
upstream = "src/core/session_manager/diag.zig"
status = "todo"
modules = []

[[file]]
upstream = "src/core/session_manager/fold.zig"
status = "partial"
modules = ["crates/ofx-session/src/session_manager/fold.rs"]
note = "State, apply and decodeState exist: turns, interruptions, settings by key with a JSON null kept apart from no value, children with their newest work, outcome and data, compactions, and a fork's children skipped before its fork point; a snapshot fx wrote decodes to the fold of the lines before it. plan and encodeState come with the v2 writer."

[[file]]
upstream = "src/core/session_manager/log.zig"
status = "partial"
modules = ["crates/ofx-session/src/session_manager/crc32c.rs", "crates/ofx-session/src/session_manager/frame.rs", "crates/ofx-session/src/session_manager/log.rs"]
note = "CRC32C (slicing by 8, with upstream's check value), the frame and line checks, lastLineEnd, the ForwardReader with its torn-tail stop and damage offsets, and the BackwardReader that checks every line and seq exist; the scanner verdicts and appends come with resume and the v2 writer."

[[file]]
upstream = "src/core/session_manager/schema.zig"
status = "partial"
modules = ["crates/ofx-session/src/session_manager/fields.rs", "crates/ofx-session/src/session_manager/json.rs", "crates/ofx-session/src/session_manager/schema.rs"]
note = "The positional header parser, every kind and its fields as parseLineBody reads them, the role, host, reason, outcome and setting names, validId and validBlobHash, and the body field reader exist, with upstream's fast path and std.json fallback: whitespace, first-wins duplicate names, numbers std.json turns into integers, rounded through f128 as std.json rounds them, enum values by name or index, strings given as byte arrays, and structs with no unknown, duplicate or missing members. A JSON-string number in Zig's hexadecimal-float form, a value matching f128's underflow point in more than 58 digits, and a digit-separated float on Zig's slow float path read differently; fx writes none of them. Encoders and new ids come with the v2 writer."

[[file]]
upstream = "src/core/session_manager/session.zig"
status = "partial"
modules = ["crates/ofx-session/src/session_manager/blobs.rs", "crates/ofx-session/src/session_manager/summary.rs", "crates/ofx-session/src/session_manager/verify.rs"]
note = "verifySession, readSummary with loadFolded (line 1, the newest snapshot found scanning backward, and the tail), the forward page read by id, and readBlob exist, all without the lock. The rest of the session lifecycle comes with the v2 writer."

[[file]]
upstream = "src/core/session_manager/storage.zig"
status = "partial"
modules = ["crates/ofx-session/src/session_manager/storage.rs"]
note = "No-follow opens of files and folders, reads, and the folder check exist, with upstream's mapping of OS errors to its IoFault causes; writes, locks and fsyncs come with the v2 writer."

