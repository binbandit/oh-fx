[[file]]
upstream = "src/core/session_manager/api.zig"
status = "partial"
modules = ["crates/ofx-session/src/session_manager.rs"]
note = "Manager.list exists, reading the index of a root that exists without creating one, as readyToRead does; the workspace filter, which no fx host passes, is left out. The other operations, the input checks and verify come with the slices that use them, and rebuild and openImport stay out because fx never calls them."

[[file]]
upstream = "src/core/session_manager/catalog.zig"
status = "partial"
modules = ["crates/ofx-session/src/session_manager/catalog.rs"]
note = "Index records decode and fold as upstream: the newest put per id with merged open times, a final tombstone, damaged lines skipped and a torn last line ignored, and list sorts newest updated first with ties to the smaller id and pages with upstream's cursor. Listing is read-only for now: a folder that is gone is skipped without the tombstone upstream writes, and a damaged index is folded without the rewrite; the index lock, appends, compaction and heal come with the v2 writer, and rebuild stays out because fx never calls it."

