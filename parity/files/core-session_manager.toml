[[file]]
upstream = "src/core/session_manager/api.zig"
status = "partial"
modules = ["crates/ofx-session/src/session_manager.rs"]
note = "Manager.list, peek, read (forward, by id, without the lock), getBlob and verify exist, reading a root that exists without creating one, as readyToRead does, with their id checks and error mapping; the workspace filter, which no fx host passes, is left out. openNew, append with checkEvents (valid JSON without surrounding whitespace, item types, host-only reasons, string settings and the 1 to 24 byte language), putBlob and close exist for a root session, with the index put on publish, on a title, workspace or language change, and on close, the published put marking the creating host's open time. The root opens on the first publish, creating missing folders 0700. Resume, fork, delete, children and the other operations come with the slices that use them, and rebuild and openImport stay out because fx never calls them."

[[file]]
upstream = "src/core/session_manager/catalog.zig"
status = "partial"
modules = ["crates/ofx-session/src/session_manager/catalog.rs"]
note = "Index records decode and fold as upstream: the newest put per id with merged open times, a final tombstone, damaged lines skipped and a torn last line ignored, and list sorts newest updated first with ties to the smaller id and pages with upstream's cursor. encodeRecord, put and the index lock exist: a put cuts a torn tail before appending, waits up to 2 s for index.lock in 5 ms steps, and rewrites the index with one line per id, tombstones dated by their last update, through index.jsonl.tmp past 1 MiB. Listing stays read-only: a folder that is gone is skipped without the tombstone upstream writes, and a damaged index is folded without the rewrite; heal and resolve come with resume, and rebuild stays out because fx never calls it."

[[file]]
upstream = "src/core/session_manager/diag.zig"
status = "partial"
modules = ["crates/ofx-session/src/session_manager/session.rs"]
note = "The writer reports held_lines_dropped and index_stale as the adapter's sessions_v2_diagnostic trace lines; the repairs and drops that report the other kinds come with resume, snapshots and rebuild."

[[file]]
upstream = "src/core/session_manager/fold.zig"
status = "partial"
modules = ["crates/ofx-session/src/session_manager/fold.rs"]
note = "State, apply and decodeState exist: turns, interruptions, settings by key with a JSON null kept apart from no value, children with their newest work, outcome and data, compactions, and a fork's children skipped before its fork point; a snapshot fx wrote decodes to the fold of the lines before it. plan numbers the turns of a batch and refuses one that breaks the turn rules as a whole; its child checks come with subagents, and encodeState with snapshots."

[[file]]
upstream = "src/core/session_manager/log.zig"
status = "partial"
modules = ["crates/ofx-session/src/session_manager/crc32c.rs", "crates/ofx-session/src/session_manager/frame.rs", "crates/ofx-session/src/session_manager/log.rs"]
note = "CRC32C (slicing by 8, with upstream's check value), the frame and line checks, lastLineEnd, the ForwardReader with its torn-tail stop and damage offsets, and the BackwardReader that checks every line and seq exist, as do appendLine and appendFramed with the line cap; the writer appends a batch with one positional write at the log's end. The scanner verdicts and the writable open come with resume."

[[file]]
upstream = "src/core/session_manager/schema.zig"
status = "partial"
modules = ["crates/ofx-session/src/session_manager/fields.rs", "crates/ofx-session/src/session_manager/json.rs", "crates/ofx-session/src/session_manager/schema.rs"]
note = "The positional header parser, every kind and its fields as parseLineBody reads them, the role, host, reason, outcome and setting names, validId and validBlobHash, and the body field reader exist, with upstream's fast path and std.json fallback: whitespace, first-wins duplicate names, numbers std.json turns into integers, rounded through f128 as std.json rounds them, enum values by name or index, strings given as byte arrays, and structs with no unknown, duplicate or missing members. A JSON-string number in Zig's hexadecimal-float form, a value matching f128's underflow point in more than 58 digits, and a digit-separated float on Zig's slow float path read differently; fx writes none of them. appendHeader, appendBody for the kinds a root session writes, appendJsonString, validItemType and newId exist, with lines equal to fx's byte for byte; the child, compaction and snapshot bodies come with their slices."

[[file]]
upstream = "src/core/session_manager/session.zig"
status = "partial"
modules = ["crates/ofx-session/src/session_manager/blobs.rs", "crates/ofx-session/src/session_manager/encode.rs", "crates/ofx-session/src/session_manager/session.rs", "crates/ofx-session/src/session_manager/summary.rs", "crates/ofx-session/src/session_manager/verify.rs"]
note = "verifySession, readSummary with loadFolded (line 1, the newest snapshot found scanning backward, and the tail), the forward page read by id, and readBlob exist, all without the lock. A new session holds its settings in memory until its first turn (D2), which stages it in .tmp/<id>, writes line 1, the held lines and the batch in one write, syncs the log, creates and locks lock, syncs the folder, renames it into the root and syncs the root. Live appends check the batch with plan, refuse blobs a line names that are not stored, and sync durable-class batches (D3); the first failed write or sync fails the session, and every later call names that cause (D40). putBlob stores a blob read-only under its SHA-256 through a .pending file, once. close interrupts an open turn, writes closed, syncs and unlocks. A durable batch syncs under the session's lock rather than outside it, and a leftover .tmp/<id> fails the publish instead of being removed. Resume, snapshots, fork, delete and blob files come with their slices."

[[file]]
upstream = "src/core/session_manager/storage.zig"
status = "partial"
modules = ["crates/ofx-session/src/session_manager/storage.rs"]
note = "No-follow opens of files and folders, reads, and the folder check exist, with upstream's mapping of OS errors to its IoFault causes, as do openRoot with missing parents created 0700, ensureDir, makeDir, exclusive 0600 and 0400 creates, positional writes, renames, fsyncs of files and folders, and flock. Hard links, setLength on logs, deleteTree and the listing come with resume, fork and rebuild."

