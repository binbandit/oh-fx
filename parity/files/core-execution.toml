[[file]]
upstream = "src/core/execution/command_runner.zig"
status = "partial"
modules = ["crates/ofx-exec/src/command_runner.rs"]
note = "Foreground supervisor and process completion exist, with upstream's `core` lines for the shell environment, termination requests, forced kills, leader completion, settlement expiry, indeterminate exits, a lost exit watch, failed cleanups, incomplete output drains and suppressed output echo; direct-argv route execution and Darwin lineage tracking are absent."

[[file]]
upstream = "src/core/execution/local_executor.zig"
status = "todo"
modules = []
note = "Approved direct argv/pipeline route execution and route-specific foreground comparison limits are unimplemented."

[[file]]
upstream = "src/core/execution/managed_execution.zig"
status = "partial"
modules = ["crates/ofx-exec/src/managed_execution.rs"]
note = "Captured running handles, output snapshots, waits and stop exist, with upstream's lost and indeterminate `core` lines; persisted execution/replay artifacts and reattached process identities are absent."

[[file]]
upstream = "src/core/execution/managed_execution_contract.zig"
status = "partial"
modules = ["crates/ofx-exec/src/managed_execution.rs"]
note = "Captured execution handles, snapshots and output barriers exist; TTY backend contracts, persisted backend state and delivery reservation/result-commit identity are absent."

[[file]]
upstream = "src/core/execution/process_identity.zig"
status = "partial"
modules = ["crates/ofx-exec/src/process_tree.rs", "crates/ofx-exec/src/native_session/processes.rs"]
note = "Linux process instance tokens (linux:<boot id>:<start ticks>) are captured and matched exactly for the terminal sessions' shells. Tokens are kept in memory only, since terminals end with the process that started them, so parsing saved tokens is not ported, and macOS tokens are not ported, as docs/differences/tool-shell.md records."

[[file]]
upstream = "src/core/execution/process_provider.zig"
status = "partial"
modules = ["crates/ofx-exec/src/managed_execution.rs"]
note = "Managed local process operations exist; injected identity provider and token matching backend contracts are absent."

[[file]]
upstream = "src/core/execution/process_tree.zig"
status = "partial"
modules = ["crates/ofx-exec/src/process_tree.rs"]
note = "Linux tree tracking and group fallback exist, with checked delivery that reports a signal it could not send to a tracked process, for the terminal sessions' signals; Darwin unique-process lineage witnesses are absent, as docs/differences/tool-shell.md records."

