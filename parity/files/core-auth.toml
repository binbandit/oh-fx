[[file]]
upstream = "src/core/auth/auth_runtime.zig"
status = "partial"
modules = ["crates/ofx-auth/src/auth_runtime.rs"]
note = "Codex credential preparation, refresh and the unrefreshed stored-login read for status exist, with their preparation and refresh trace lines; Vercel/Grok preparation, inventory and provider transition handling are absent."

[[file]]
upstream = "src/core/auth/auth_transition.zig"
status = "partial"
modules = ["crates/ofx-app/src/app_agent_runtime/sign_out.rs"]
note = "The default /logout target and the busy rule for signing out of the selected provider are implemented; Gateway and Grok logout fallbacks are absent because oh-fx has no Gateway transport and does not activate Grok."

[[file]]
upstream = "src/core/auth/browser_callback.zig"
status = "partial"
modules = ["crates/ofx-auth/src/browser_callback.rs"]
note = "Loopback GET callback validation and success/failure HTML responses exist; upstream exact-origin form POST acceptance, CORS handling and separate lifecycle-cancellation input are absent, and the socket timeout setup trace lines do not apply because the callback uses async timeouts."

[[file]]
upstream = "src/core/auth/chatgpt_oauth.zig"
status = "partial"
modules = ["crates/ofx-auth/src/chatgpt_oauth.rs"]
note = "Browser PKCE login started and finished separately, callback validation, token refresh, session retirement, the loopback test endpoints and the auth trace lines exist."

[[file]]
upstream = "src/core/auth/chatgpt_session.zig"
status = "partial"
modules = ["crates/ofx-auth/src/chatgpt_session.rs"]
note = "Native token/account parsing, expiry skew, locked durable file mutation and the session load trace lines exist; the load lines start at the profile directory, as oh-fx opens no home directory first. Upstream uses profile files, not a native keychain backend."

[[file]]
upstream = "src/core/auth/credential_authority.zig"
status = "partial"
modules = ["crates/ofx-app/src/codex_provider.rs"]
