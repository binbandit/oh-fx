note = "Auth mode and Codex guidance exist; catalog access authority, Vercel team context and multi-provider credential-source projection are absent."

[[file]]
upstream = "src/core/auth/grok_oauth.zig"
status = "partial"
modules = ["crates/ofx-auth/src/grok_oauth.rs", "crates/ofx-auth/src/grok_oauth/run_login.rs", "crates/ofx-auth/src/grok_oauth/sign_in.rs"]
note = "Browser and manual-code sign-in, callback classification, token exchange, account lookup, logout and revocation exist with their trace lines; credential refresh (loadAccess) with its trace lines and activation after sign-in are deferred with the Grok request route, as docs/differences/auth.md records, and tests pass loopback endpoints to the constructor in place of upstream's FX_E2E overrides."

[[file]]
