[[file]]
upstream = "src/core/upgrade/auto_upgrade.zig"
status = "ported"
modules = ["crates/ofx-app/src/app_upgrade_runtime.rs", "crates/ofx-app/src/app_upgrade_runtime/session_upgrader.rs", "crates/ofx-app/src/app_upgrade_runtime/live_release.rs", "crates/ofx-upgrade/src/auto.rs", "crates/oh-fx/src/auto_upgrade.rs", "crates/oh-fx/src/upgrade_command.rs"]
note = "The interactive shell's in-process upgrader, its footer labels, stop-during-install, the relaunch request Ctrl+G records, and the auto_upgrade setting are ported; the release-build check, the cadence, the relaunch without a previous revision, the detached run for one-shot commands, and the embedded-host stop differ, as docs/differences/upgrade.md records."

[[file]]
upstream = "src/core/upgrade/update_notes.zig"
status = "ported"
modules = ["crates/ofx-upgrade/src/release_source.rs"]
note = "Update notices link the new version's GitHub release page; upstream's changelog anchors and revision compare ranges belong to its two channels, as docs/differences/upgrade.md records."

[[file]]
upstream = "src/core/upgrade/update_target.zig"
status = "ported"
modules = ["crates/ofx-upgrade/src/update_target.rs", "crates/ofx-upgrade/src/release_source.rs"]
note = "Versions are normalized, validated and ordered, with `-dev.<n>` ordered numerically, and revisions are validated; upstream's development manifest, channel routing and revision targets serve its two channels, as docs/differences/upgrade.md records."

[[file]]
upstream = "src/core/upgrade/upgrade_helpers.zig"
status = "ported"
modules = ["crates/ofx-upgrade/src/archive.rs", "crates/ofx-upgrade/src/control.rs", "crates/ofx-upgrade/src/upgrade.rs"]
note = "Downloads stay in memory and stage next to the executable, so the stale sweep removes staged copies there instead of temporary download directories; a stop drops the transfer future instead of shutting down its socket."

[[file]]
upstream = "src/core/upgrade/upgrade_runtime.zig"
status = "ported"
modules = ["crates/ofx-upgrade/src/upgrade.rs", "crates/oh-fx/src/upgrade_command.rs"]
note = "The stable flow, the text and JSON reports, and the progress line with its found-line pause and clamped percentages are ported; upstream's channel targets and revision comparison serve its two channels, and the command checks more before installing, as docs/differences/upgrade.md records."
