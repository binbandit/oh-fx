merge_queue:
  mode: serial
  max_parallel_checks: 3

queue_rules:
  - name: main
    queue_conditions:
      - base = main
      - -draft
      - or:
          - -label = codex
          - label = codex-approved
      # Review the source PR once, including PRs authored by Pullfrog itself.
      - check-success = @pullfrog/pullfrog
      - check-success = @pullfrog/pullfrog-approval
    merge_conditions:
      # Temporary integration PRs rerun CI without another Pullfrog review.
      - check-success = @github-actions/Repository checks
    merge_method: squash
    update_method: rebase
    batch_size: 3
    batch_max_wait_time: 2 min
    max_checks_retries: 2
    checks_timeout: 45 min

priority_rules:
  - name: priority label
    conditions:
      - base = main
      - label = priority
    priority: high
    allow_checks_interruption: true

merge_protections_settings:
  post_comment: false
  auto_merge_conditions:
    - base = main
    - -draft
    - or:
        - -label = codex
        - label = codex-approved

merge_protections:
  - name: Resolve requested changes
    if:
      - base = main
    success_conditions:
      - "#changes-requested-reviews-by = 0"
  - name: Hold Codex pull requests for maintainer review
    if:
      - base = main
      - label = codex
    success_conditions:
      - label = codex-approved
