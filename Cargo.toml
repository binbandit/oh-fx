[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
flate2 = "1.1.10"
lexopt = "0.3.2"
ofx-config = { path = "crates/ofx-config" }
ofx-http = { path = "crates/ofx-http" }
ofx-upgrade = { path = "crates/ofx-upgrade" }
ra-ap-rustc_lexer = "0.174.0"
regex = "1.13"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
semver = "1.0.28"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
