[workspace]
resolver = "3"
members = ["crates/*", "xtask", "xtask/footprint"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
flate2 = "1.1.10"
getrandom = "0.4.3"
memchr = "2.8.3"
nix = { version = "0.31.3", default-features = false }
ofx-agent = { path = "crates/ofx-agent" }
ofx-app = { path = "crates/ofx-app" }
ofx-auth = { path = "crates/ofx-auth" }
ofx-cli = { path = "crates/ofx-cli" }
ofx-config = { path = "crates/ofx-config" }
ofx-contract = { path = "crates/ofx-contract" }
ofx-exec = { path = "crates/ofx-exec" }
ofx-gateway = { path = "crates/ofx-gateway" }
ofx-http = { path = "crates/ofx-http" }
ofx-jsonrpc = { path = "crates/ofx-jsonrpc" }
ofx-markdown = { path = "crates/ofx-markdown" }
ofx-mcp = { path = "crates/ofx-mcp" }
ofx-permissions = { path = "crates/ofx-permissions" }
ofx-session = { path = "crates/ofx-session" }
ofx-shell = { path = "crates/ofx-shell" }
ofx-skills = { path = "crates/ofx-skills" }
ofx-testkit = { path = "crates/ofx-testkit" }
ofx-tui = { path = "crates/ofx-tui" }
ofx-text = { path = "crates/ofx-text" }
ofx-tools = { path = "crates/ofx-tools" }
ofx-upgrade = { path = "crates/ofx-upgrade" }
ofx-vt = { path = "crates/ofx-vt" }
ofx-workspace = { path = "crates/ofx-workspace" }
percent-encoding = "2.3.2"
ra-ap-rustc_lexer = "0.174.0"
regex = "1.13"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustix = { version = "1.1.5", default-features = false, features = ["std", "system"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip", "preserve_order"] }
sha2 = "0.11.0"
signal-hook = "0.4.4"
subtle = "2.6.1"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt"] }
tokio-rustls = { version = "0.26.6", default-features = false }
tokio-util = "0.7.19"
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde", "std"] }
unicode-properties = { version = "0.1.4", default-features = false, features = ["general-category"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
vt100 = "0.16.2"
zeroize = "1.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true

[profile.release.package.ofx-agent]
opt-level = 3

[profile.release.package.ofx-gateway]
opt-level = 3

[profile.release.package.ofx-markdown]
opt-level = 3

[profile.release.package.ofx-tui]
opt-level = 3
