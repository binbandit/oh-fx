name: Guard maintainer approval

on:
  pull_request_target:
    types: [synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  # No concurrency group: cancelling a superseded run could skip a removal the earlier push needs.
  guard:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'codex-approved') && (
        contains(github.event.pull_request.labels.*.name, 'codex') ||
        startsWith(github.event.pull_request.head.ref, 'codex/')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout: pushed commits are fetched as data and never executed.
      # The approval stays only when replaying the reviewed change onto the pushed fork point,
      # without conflicts, gives exactly the pushed tree. Anything else, or any failure, drops it.
      - name: Replay the reviewed change
        id: compare
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          fork() {
            local point merges
            point="$(git merge-base refs/base "$1")" || return 1
            merges="$(git rev-list --merges "$point..$1")" || return 1
            [ -z "$merges" ] || return 1
            echo "$point"
          }
          export GIT_DIR="$RUNNER_TEMP/approval.git"
          git init -q --bare
          reviewed=changed
          if git fetch -q --no-tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "+refs/heads/$BASE_REF:refs/base" "$BEFORE" "$AFTER" &&
            reviewed_fork="$(fork "$BEFORE")" && pushed_fork="$(fork "$AFTER")" &&
            replayed="$(git merge-tree --write-tree --merge-base="$reviewed_fork" "$pushed_fork" "$BEFORE")" &&
            pushed="$(git rev-parse --verify "$AFTER^{tree}")" && [ "$replayed" = "$pushed" ]; then
            reviewed=unchanged
          fi
          echo "Reviewed change: $reviewed"
          echo "reviewed=$reviewed" >> "$GITHUB_OUTPUT"
      - name: Remove the approval
        if: ${{ !cancelled() && steps.compare.outputs.reviewed != 'unchanged' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          COMMENT: New commits since approval; `codex-approved` removed until the maintainer re-reviews.
        run: |
          issue="repos/$GITHUB_REPOSITORY/issues/$PULL_REQUEST"
          approved="$(gh api --paginate "$issue/labels" --jq '.[] | select(.name == "codex-approved") | .name')"
          if [ -n "$approved" ]; then
            gh api --method DELETE "$issue/labels/codex-approved" --silent
            gh api "$issue/comments" --silent -f body="$COMMENT"
          fi
