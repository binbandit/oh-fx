name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'edited' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  automation:
    name: Automation checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Test review cleanup
        run: node --test .github/tests/tidy-pullfrog-reviews.test.cjs
      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12

  rust-lint:
    name: Rust lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format, comments, and clippy
        run: cargo xtask lint
      - name: Attribution and conventional commits
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_COMMITS: ${{ github.event.pull_request.commits }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --depth="$PR_COMMITS" origin "$HEAD_SHA"
          {
            printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY"
            git log --format='Author: %an <%ae>%nCommitter: %cn <%ce>%n%B' -n "$PR_COMMITS" "$HEAD_SHA"
          } > "$RUNNER_TEMP/attribution.txt"
          cargo xtask attribution "$RUNNER_TEMP/attribution.txt"
          git log --format=%s -n "$PR_COMMITS" "$HEAD_SHA" > "$RUNNER_TEMP/subjects.txt"
          cargo xtask subjects "$RUNNER_TEMP/subjects.txt"
      - name: Conventional PR title
        if: >-
          github.event_name == 'pull_request' && !(
            github.event.pull_request.user.login == 'mergify[bot]' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            startsWith(github.head_ref, 'mergify/merge-queue/')
          )
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/title.txt"
          cargo xtask title "$RUNNER_TEMP/title.txt"
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-machete
      - name: Unused dependencies
        run: cargo machete

  rust-test:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test
        run: cargo xtask test

  footprint:
    name: Footprint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CC_x86_64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install musl, valgrind, and strace
        continue-on-error: true
        timeout-minutes: 5
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools valgrind strace
      - name: Install toolchain
        continue-on-error: true
        timeout-minutes: 5
        run: |
          rustup toolchain install
          rustup target add x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        continue-on-error: true
        with:
          key: footprint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Resolve the comparison base
        id: base
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base=""
          if [ "$EVENT_NAME" = pull_request ] && git rev-parse --verify --quiet 'HEAD^2' > /dev/null; then
            base="$(git rev-parse 'HEAD^1')"
          elif [ "$EVENT_NAME" = push ] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2> /dev/null; then
            base="$PUSH_BEFORE"
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - name: Report size and startup cost
        continue-on-error: true
        timeout-minutes: 20
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.txt"
          set -- --summary "$GITHUB_STEP_SUMMARY" --pr-body "$RUNNER_TEMP/pr-body.txt"
          if [ -n "$BASE_SHA" ]; then
            set -- "$@" --base "$BASE_SHA"
          fi
          cargo xtask footprint "$@"

  repository:
    name: Repository checks
    needs: [automation, rust-lint, rust-test, footprint]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
